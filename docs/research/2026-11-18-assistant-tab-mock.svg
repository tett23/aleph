<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13">
  <rect width="1200" height="560" fill="#f4f4f2"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#222">下部パネルの「アシスタント」のタブ (ADR 0081)</text>
  <g transform="translate(24,44)">
    <rect width="1152" height="496" fill="#fff" stroke="#ccc"/>
    <rect width="1152" height="160" fill="#fafaf8" stroke="#ddd"/>
    <text x="20" y="28" fill="#333">style.toml</text>
    <text x="20" y="56" font-family="Menlo, monospace" font-size="12" fill="#333">[page.grid]</text>
    <rect x="16" y="64" width="300" height="20" fill="#fff4c2"/>
    <text x="20" y="78" font-family="Menlo, monospace" font-size="12" fill="#333">line-pitch = "18H"</text>
    <text x="20" y="100" font-family="Menlo, monospace" font-size="12" fill="#333">font-size = "13Q"</text>
    <rect y="160" width="1152" height="28" fill="#efefeb" stroke="#ddd"/>
    <text x="16" y="179" fill="#777">問題</text><text x="64" y="179" fill="#777">通知</text>
    <rect x="104" y="162" width="96" height="26" fill="#fff" stroke="#ccc"/><text x="116" y="179" font-weight="700">アシスタント</text>
    <!-- history -->
    <text x="20" y="216" fill="#888" font-size="12">頼み (style.toml の選択した範囲)</text>
    <text x="20" y="236">行送りを少し広げて</text>
    <rect x="16" y="248" width="700" height="148" rx="6" fill="#fff" stroke="#d6d6d0"/>
    <text x="32" y="272">行送り（line-pitch）を 18H から 20H に広げます。</text>
    <rect x="32" y="284" width="668" height="20" fill="#fde8e8"/><text x="40" y="299" font-family="Menlo, monospace" font-size="12" fill="#a33">- line-pitch = "18H"</text>
    <rect x="32" y="304" width="668" height="20" fill="#e3f4e3"/><text x="40" y="319" font-family="Menlo, monospace" font-size="12" fill="#2a7a2a">+ line-pitch = "20H"</text>
    <rect x="32" y="344" width="64" height="26" rx="4" fill="#2f6fde"/><text x="48" y="362" fill="#fff">適用</text>
    <rect x="104" y="344" width="72" height="26" rx="4" fill="#fff" stroke="#999"/><text x="118" y="362">捨てる</text>
    <text x="440" y="362" fill="#888" font-size="11">ローカル（Qwen3.5-4B）　2.5 秒</text>
    <!-- input -->
    <rect x="16" y="414" width="1120" height="68" rx="6" fill="#fff" stroke="#999"/>
    <text x="28" y="438" fill="#aaa">頼みを書く（⌘↩ で送る）</text>
    <text x="28" y="470" fill="#666" font-size="12">対象：選択した範囲（1 行）</text>
    <rect x="820" y="452" width="180" height="22" rx="4" fill="#fff" stroke="#bbb"/><text x="832" y="468" font-size="12">ローカル（Qwen3.5-4B） ▾</text>
    <rect x="1012" y="450" width="112" height="26" rx="4" fill="#2f6fde"/><text x="1046" y="468" fill="#fff">送る</text>
    <text x="760" y="216" fill="#999" font-size="11">「適用」→ 未コミットならダイアログ (ADR 0088) → 一つの変更として当て、保存し、差分のタブを出す</text>
  </g>
</svg>
