<!doctype html><html lang="ja"><meta charset="utf-8"><style>
/* .tabbar and .tab as in app/style.css at 4d0e5ed (lines 637-638) */
.tabbar{flex:none;display:flex;align-items:stretch;height:30px;width:400px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;max-width:220px;font-size:12px;border-right:1px solid #ccc;white-space:nowrap}
</style><div class=tabbar id=b></div><script>
const b=document.getElementById("b");
const html=n=>Array.from({length:n},(_,i)=>`<div class=tab>第${i+1}章のとても長い名前</div>`).join("");
const out={};
b.innerHTML=html(1);out.widthAlone=b.children[0].getBoundingClientRect().width;
b.innerHTML=html(12);out.widthOf12=b.children[0].getBoundingClientRect().width;
out.clientWidth=b.clientWidth;out.scrollWidth=b.scrollWidth;
b.scrollLeft=500;out.before=b.scrollLeft;
b.innerHTML=html(12);out.afterSameContent=b.scrollLeft;
b.innerHTML=html(3);out.afterThreeTabs=b.scrollLeft;
window.webkit.messageHandlers.done.postMessage(JSON.stringify(out));
</script>
