<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13">
  <rect width="1200" height="800" fill="#f4f4f2"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#222">1. 「適用」を押したとき、コミットしていない変更があれば出すモーダルのダイアログ</text>
  <g transform="translate(24,44)">
    <rect width="1152" height="250" fill="#fff" stroke="#ccc"/>
    <rect width="1152" height="250" fill="#000" opacity="0.32"/>
    <rect x="356" y="40" width="440" height="170" rx="8" fill="#fff" stroke="#999"/>
    <text x="380" y="72" font-size="15" font-weight="700">適用する前に、コミットしますか？</text>
    <text x="380" y="100" fill="#444">ワークスペースに、コミットしていない変更があります。</text>
    <text x="380" y="120" fill="#444">アシスタントの書き換えは、正しくないことや、壊れることがあります。</text>
    <text x="380" y="140" fill="#444">コミットしておくと、書き換えの分だけを差分で見て、戻せます。</text>
    <rect x="420" y="166" width="64" height="28" rx="4" fill="#fff" stroke="#999"/><text x="436" y="185">やめる</text>
    <rect x="492" y="166" width="140" height="28" rx="4" fill="#fff" stroke="#999"/><text x="504" y="185">コミットせずに適用</text>
    <rect x="640" y="166" width="132" height="28" rx="4" fill="#2f6fde"/><text x="652" y="185" fill="#fff">コミットして適用</text>
    <text x="24" y="240" fill="#fff" font-size="11">ダイアログが出ているあいだは、キーもマウスも背面に届かない</text>
  </g>

  <text x="24" y="330" font-size="16" font-weight="700" fill="#222">2. 差分のタブ。リボンの「差分」か、適用の後に開く</text>
  <g transform="translate(24,344)">
    <rect width="1152" height="430" fill="#fff" stroke="#ccc"/>
    <rect width="36" height="430" fill="#e8e8e4"/>
    <g fill="#777" font-size="11">
      <text x="10" y="24">□</text><text x="10" y="50">□</text><text x="10" y="76">□</text><text x="10" y="102">□</text><text x="10" y="128">□</text>
      <rect x="4" y="140" width="28" height="24" rx="4" fill="#d6e2f7"/><text x="10" y="157" fill="#2f6fde">±</text>
      <text x="40" y="157" fill="#2f6fde">← 差分</text>
    </g>
    <rect x="206" width="946" height="30" fill="#fafaf8" stroke="#ddd"/>
    <rect x="206" y="30" width="470" height="28" fill="#efefeb" stroke="#ddd"/>
    <rect x="210" y="34" width="90" height="22" fill="#efefeb" stroke="#ccc"/><text x="220" y="50" fill="#777">01.gm</text>
    <text x="226" y="90" fill="#333">［strong: 大切］なことは…</text>
    <rect x="676" y="30" width="4" height="400" fill="#ccc"/>
    <rect x="680" y="30" width="472" height="28" fill="#efefeb" stroke="#ddd"/>
    <rect x="684" y="34" width="90" height="22" fill="#fff" stroke="#bbb"/><text x="694" y="50">± 差分 ×</text>
    <rect x="680" y="58" width="472" height="26" fill="#fafaf8" stroke="#e2e2de"/>
    <text x="692" y="76" fill="#555">prose　HEAD との差分　3 ファイル</text>
    <text x="1080" y="76" fill="#2f6fde">再読み込み</text>
    <text x="692" y="108" font-weight="700" fill="#2f6fde">trapahi/chapters/01.gm</text><text x="900" y="108" fill="#888">変更　+1 −1</text>
    <rect x="692" y="116" width="448" height="18" fill="#fde8e8"/><text x="700" y="129" font-family="Menlo, monospace" font-size="12" fill="#a33">- 大切なことは…</text>
    <rect x="692" y="134" width="448" height="18" fill="#e3f4e3"/><text x="700" y="147" font-family="Menlo, monospace" font-size="12" fill="#2a7a2a">+ ［strong: 大切］なことは…</text>
    <text x="692" y="182" font-weight="700" fill="#2f6fde">trapahi/plot.csv</text><text x="900" y="182" fill="#888">追加　+2</text>
    <rect x="692" y="190" width="448" height="36" fill="#e3f4e3"/><text x="700" y="203" font-family="Menlo, monospace" font-size="12" fill="#2a7a2a">+ scene,file,subplots,…</text><text x="700" y="220" font-family="Menlo, monospace" font-size="12" fill="#2a7a2a">+ 第一章,chapters/01.gm,…</text>
    <text x="692" y="256" font-weight="700" fill="#2f6fde">trapahi/fonts/cover.png</text><text x="900" y="256" fill="#888">変更　バイナリ</text>
    <text x="692" y="400" fill="#999" font-size="11">ファイルの名前を押すと、そのシートを開く。見るだけで、コミットや戻すことは Git のパネルで行う。</text>
  </g>
</svg>
