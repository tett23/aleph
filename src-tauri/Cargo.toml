[package]
name = "aleph"
version = "1.0.0-rc7"
edition = "2021"
license = "MIT"

[lib]
name = "aleph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4.34"
regex = "1.13.1"
git2 = { version = "=0.21.0", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
libgit2-sys = "=0.18.8"

# NSSpellChecker for English spelling (docs/adr/0030), and the pasteboard and the
# drag session that hand files to other applications (docs/adr/0077); already in
# the tree through Tauri
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSSpellChecker",
  "NSApplication",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSGraphicsContext",
  "NSImage",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSRange",
  "NSArray",
  "NSGeometry",
  "NSURL",
] }
