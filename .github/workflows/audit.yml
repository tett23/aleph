name: Audit

# Known vulnerabilities in the dependencies the app ships (docs/adr/0049): on
# every pull request, on main, and once a week, when nothing in this
# repository changes but the advisories do. A failed weekly run stays a failed
# run; no issue is opened.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # The packages in the app, high and critical only; dev tools (Vite,
      # TypeScript) are not shipped and do not fail the check
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      # RustSec's advisory database against src-tauri/Cargo.lock; the version
      # is fixed, and a temporary exception goes in src-tauri/.cargo/audit.toml with
      # its reason and the day to look again
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
